name: CI

on:
  # No path filter: the required `CI result` check must report on every pull request.
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Pull requests cancel superseded runs; every push to main and every tag publishes its image.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci --reporter=github
      - run: shellcheck entrypoint.sh tests/run.sh scripts/*.sh
      # Supervisor pulls the image tagged with the app version, so a release tag must match it.
      - name: Check the app version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/check-release.sh ${TAG:+"$TAG"}

  test:
    name: Image test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t lan-dhcp:test .
      - run: tests/run.sh lan-dhcp:test

  image:
    name: Image
    needs: [checks, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The Home Assistant app runs on aarch64 (the Yellow), the NAS spare on amd64.
      - uses: lipkau/gh-tools/actions/container-image@e3ed36df3d68c66d7ebf27f5ab0d3b0a7cf45af3 # container-image/v1.0.0
        with:
          platforms: linux/amd64,linux/arm64
          latest: release

  # The only check the main branch ruleset requires. Add every new job to `needs`.
  ci-result:
    name: CI result
    if: always()
    needs: [checks, test, image]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

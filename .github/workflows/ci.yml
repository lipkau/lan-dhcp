name: CI

on:
  # No path filter: the required `CI result` check must report on every pull request.
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Pull requests cancel superseded runs; every push to main and every tag publishes its image.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci --reporter=github
      - run: shellcheck lan_dhcp/entrypoint.sh tests/run.sh .github/scripts/*.sh
      # Supervisor pulls the image tagged with the app version, so a release tag must match it.
      - name: Check the app version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: .github/scripts/check-release.sh ${TAG:+"$TAG"}

  app:
    name: App lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Checks lan_dhcp/config.yaml against the Supervisor's app schema and its icon and logo.
      - uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: lan_dhcp

  test:
    name: Image test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t lan-dhcp:test lan_dhcp
      - run: tests/run.sh lan-dhcp:test

  image:
    name: Image
    needs: [checks, app, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The Home Assistant app runs on aarch64 (the Yellow), the NAS spare on amd64.
      - uses: lipkau/gh-tools/actions/container-image@e3ed36df3d68c66d7ebf27f5ab0d3b0a7cf45af3 # container-image/v1.0.0
        with:
          context: lan_dhcp
          platforms: linux/amd64,linux/arm64
          latest: release

  # A push to main that changes the app releases it: release.sh bumps the version and the changelog,
  # and this job pushes that commit and its v<version> tag, whose CI run publishes the image. It pushes
  # with the RELEASE_DEPLOY_KEY deploy key, which may bypass the main ruleset; a push with the workflow
  # token would start no CI run for the tag.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, app, test]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Check the deploy key
        env:
          HAS_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::The RELEASE_DEPLOY_KEY secret is missing, so nothing can be released (CONTRIBUTING.md#releases)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Release the app if it changed
        run: |
          # A newer push to main releases this commit's changes along with its own.
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on; its newer run releases this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898828+github-actions[bot]@users.noreply.github.com"
          tag=$(.github/scripts/release.sh)
          [ -n "$tag" ] || exit 0
          git push --atomic origin HEAD:main "$tag"
          echo "Released [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$tag); its CI run publishes the image." >> "$GITHUB_STEP_SUMMARY"

  # The only check the main branch ruleset requires. Add every new job to `needs`.
  ci-result:
    name: CI result
    if: always()
    needs: [checks, app, test, image, release]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

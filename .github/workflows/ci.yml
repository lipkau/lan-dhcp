name: CI

on:
  # No path filter: the required `CI result` check must report on every pull request.
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Pull requests cancel superseded runs; every push to main and every tag publishes its image.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Check the lease page
        working-directory: lan_dhcp/status
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - run: npm ci
      - run: npx biome ci --reporter=github
      - run: shellcheck lan_dhcp/entrypoint.sh tests/*.sh .github/scripts/*.sh
      - run: tests/release.sh
      # Supervisor pulls the image tagged with the app version, so a release tag must match it.
      - name: Check the app version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: .github/scripts/check-release.sh ${TAG:+"$TAG"}

  # The release job reads these subjects for the version and the changelog. A squash merge takes the
  # title or, for one commit, its subject; a merge commit takes the commits. Editing the title doesn't
  # re-run this job: push again or re-run it.
  subjects:
    name: Commit subjects
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check the title and commit subjects are conventional commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: [^ ]'
          bad=$(
            { printf '%s\n' "$TITLE"; git log --no-merges --format=%s "$BASE..HEAD"; } |
              grep -Ev "$pattern" || true
          )
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad" | while IFS= read -r subject; do
              echo "::error::Not a conventional commit (CONTRIBUTING.md#releases): $subject"
            done
            exit 1
          fi

  app:
    name: App lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Checks lan_dhcp/config.yaml against the Supervisor's app schema and its icon and logo.
      - uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: lan_dhcp

  test:
    name: Image test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t lan-dhcp:test lan_dhcp
      - run: tests/run.sh lan-dhcp:test
      - name: Test with the app's AppArmor profile
        run: |
          profile=local_lan_dhcp
          policy="$RUNNER_TEMP/$profile"
          sed "s/^profile lan_dhcp /profile $profile /" lan_dhcp/apparmor.txt > "$policy"
          names=$(sudo apparmor_parser --names --skip-cache "$policy")
          test "$(printf '%s\n' "$names" | grep -xc "$profile")" = 1
          test -z "$(printf '%s\n' "$names" | grep -vE "^$profile(//.+)?$")"
          sudo apparmor_parser --replace --skip-cache "$policy"
          started=$(date +%s)
          tests/run.sh lan-dhcp:test "$profile"
          tests/ingress.sh lan-dhcp:test "$profile"
          denials=$(sudo journalctl --dmesg --since "@$started" --no-pager --grep 'apparmor="DENIED"' |
            grep -F "profile=\"$profile" | grep -vF 'name="/data/lan-dhcp-test-blocked"' || true)
          if [ -n "$denials" ]; then
            printf '%s\n' "$denials"
            exit 1
          fi
      - name: Show AppArmor denials
        if: failure()
        run: sudo journalctl --dmesg --grep 'apparmor="DENIED"' --no-pager

  image:
    name: Image
    needs: [checks, app, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The Home Assistant app runs on aarch64 (the Yellow), the NAS spare on amd64.
      - uses: lipkau/gh-tools/actions/container-image@e3ed36df3d68c66d7ebf27f5ab0d3b0a7cf45af3 # container-image/v1.0.0
        with:
          context: lan_dhcp
          platforms: linux/amd64,linux/arm64
          latest: release

  # A push to main that changes the app releases it: release.sh bumps the version and the changelog,
  # and this job pushes that commit and its v<version> tag, whose CI run publishes the image. It pushes
  # with the RELEASE_DEPLOY_KEY deploy key, which may bypass the main ruleset; a push with the workflow
  # token would start no CI run for the tag. The key is a secret of the `release` environment, which
  # only main may use.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, app, test]
    runs-on: ubuntu-latest
    environment: release
    # Every waiting run keeps its place: with one pending slot, a re-run of an older commit would
    # replace, and so drop, the release of a newer one.
    concurrency:
      group: release
      queue: max
    steps:
      - name: Check the deploy key
        env:
          HAS_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::The release environment has no RELEASE_DEPLOY_KEY secret, so nothing can be released (CONTRIBUTING.md#releases)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Release the app if it changed
        run: |
          # A newer push to main releases this commit's changes along with its own.
          main_moved() {
            git fetch -q origin main
            [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]
          }
          if main_moved; then
            echo "::notice::main has moved on; its newer run releases this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898828+github-actions[bot]@users.noreply.github.com"
          tag=$(.github/scripts/release.sh)
          [ -n "$tag" ] || exit 0
          if ! git push --atomic origin HEAD:main "$tag"; then
            if main_moved; then
              echo "::notice::main moved on during the release; its newer run releases this commit."
              exit 0
            fi
            exit 1
          fi
          echo "Released [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$tag); its CI run publishes the image." >> "$GITHUB_STEP_SUMMARY"

  # The only check the main branch ruleset requires. Add every new job to `needs`.
  ci-result:
    name: CI result
    if: always()
    needs: [checks, subjects, app, test, image, release]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

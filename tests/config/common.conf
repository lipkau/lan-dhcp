port=5300
bind-dynamic
no-resolv
no-hosts
bogus-priv
domain=home.arpa
local=/home.arpa/
log-facility=-
log-dhcp
dhcp-authoritative

dhcp-option=1,255.255.255.0
dhcp-option=3,172.31.250.1
dhcp-option-force=6,172.31.250.2

dhcp-mac=set:local-mac,02:*:*:*:*:*
dhcp-host=02:00:00:00:00:01,set:infra-exception
tag-if=set:short-pool,tag:local-mac,tag:!infra-exception
